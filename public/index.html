<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras de Lectura 📚</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .card-login {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    h1 { color: #6C5CE7; font-size: 26px; margin-bottom: 8px; }
    p { color: #636E72; font-size: 14px; margin-bottom: 25px; }
    .input-group { margin-bottom: 18px; text-align: left; }
    label { display: block; margin-bottom: 6px; color: #2D3436; font-weight: 600; font-size: 14px; }
    input {
      width: 100%; padding: 12px 16px; border: 2px solid #E0E0E0;
      border-radius: 12px; font-size: 15px; outline: none;
    }
    input:focus { border-color: #6C5CE7; }
    button {
      width: 100%; padding: 14px; background: #6C5CE7; color: white;
      border: none; border-radius: 12px; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-top: 10px;
    }
    button:hover { background: #5B4BC4; }
    .error-msg { color: #FF7675; margin-top: 15px; font-size: 14px; display: none; }
    
    /* Estilos para el botón de ver contraseña */
    .caja-password { position: relative; }
    .btn-ver {
      position: absolute; right: 12px; top: 12px; cursor: pointer; 
      color: #6C5CE7; font-weight: bold; font-size: 14px; user-select: none;
    }
  </style>
</head>
<body>

  <div class="card-login">
    <h1>¡Bienvenido/a! 📖</h1>
    <p>Ingresa tus datos para empezar a leer</p>

    <form id="formLogin">
      <div class="input-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="Tu usuario" required>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <div class="caja-password">
          <input type="password" id="password" placeholder="••••••••" required style="padding-right: 50px;">
          <span id="btnVerContrasena" class="btn-ver">Ver</span>
        </div>
      </div>

      <button type="submit">Entrar</button>
      <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</div>
    </form>
  </div>

  <script>
    // Lógica para mostrar/ocultar contraseña
    const btnVer = document.getElementById('btnVerContrasena');
    const inputPassword = document.getElementById('password');
    
    btnVer.addEventListener('click', () => {
      if (inputPassword.type === 'password') {
        inputPassword.type = 'text';
        btnVer.textContent = 'Ocultar';
      } else {
        inputPassword.type = 'password';
        btnVer.textContent = 'Ver';
      }
    });

    // Lógica de inicio de sesión
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      try {
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          // Solución al problema del nombre "Desconocido"
          localStorage.setItem('usuario', data.username);
          
          if (data.rol === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/estudiante.html';
          }
        } else {
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Error al conectar con el servidor';
        errorMsg.style.display = 'block';
      }
    });
  </script>

</body>
</html>
